<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>finance-agent 投研工作台</title>
<style>
  :root {
    --bg:#0b1020; --panel:#121a2e; --panel2:#0e1629; --line:rgba(255,255,255,.12);
    --text:#eef3ff; --muted:#9fb0d0; --accent:#79a8ff; --chip:#253654;
    --ok:#7ee2a8; --err:#ff9b9b;
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; overflow:hidden;
    display:grid; grid-template-columns: 240px 1fr 320px;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); }

  /* ---- 左栏：会话列表（localStorage） ---- */
  nav { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; }
  nav .top { padding:14px; border-bottom:1px solid var(--line); }
  #newChat { width:100%; padding:10px; border-radius:10px; border:1px solid rgba(121,168,255,.35);
    background:linear-gradient(180deg,#2a63e8,#1f4dbd); color:#fff; cursor:pointer; font-weight:600; font-size:13px; }
  #sessionList { flex:1; overflow-y:auto; padding:8px; }
  .sess { position:relative; padding:10px 26px 10px 12px; border-radius:10px; cursor:pointer;
    margin-bottom:4px; border:1px solid transparent; }
  .sess:hover { background:var(--panel); }
  .sess.active { background:var(--panel); border-color:var(--line); }
  .sess .t { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .s { color:var(--muted); font-size:11px; margin-top:3px; }
  .sess .s .running { color:var(--ok); }
  .sess .del { position:absolute; right:6px; top:8px; color:var(--muted); border:none;
    background:none; cursor:pointer; font-size:14px; padding:2px 5px; display:none; }
  .sess:hover .del { display:block; }
  .sess .del:hover { color:var(--err); }
  nav .hint { padding:10px 14px; color:var(--muted); font-size:11px; border-top:1px solid var(--line); }

  /* ---- 中栏：对话 ---- */
  main { display:flex; flex-direction:column; border-right:1px solid var(--line); min-width:0; min-height:0; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); flex:none; }
  header h1 { font-size:15px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; margin-top:4px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; min-height:0; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word; font-size:14px; }
  .user { align-self:flex-end; background:#1f4dbd; }
  .bot  { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .error { align-self:flex-start; background:rgba(255,90,90,.12); border:1px solid rgba(255,120,120,.4); }
  .empty-chat { margin:auto; color:var(--muted); font-size:14px; text-align:center; line-height:2; }

  /* 执行过程时间线 */
  details.trace { align-self:stretch; max-width:82%; background:var(--panel2);
    border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:12px; }
  details.trace summary { cursor:pointer; color:var(--muted); user-select:none; }
  details.trace summary .spin { display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .trace .line { padding:3px 0 3px 8px; color:var(--muted); border-left:2px solid var(--chip);
    margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .trace .line .agent { color:var(--accent); }
  .trace .line .okmark { color:var(--ok); }
  .trace .line .errmark { color:var(--err); }

  form { display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); flex:none; }
  input#input { flex:1; padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); outline:none; font-size:14px; }
  button#send { padding:12px 22px; border-radius:12px; border:1px solid rgba(121,168,255,.35);
    background:linear-gradient(180deg,#2a63e8,#1f4dbd); color:#fff; cursor:pointer; font-weight:600; }
  button#send:disabled { opacity:.5; cursor:wait; }

  /* ---- 右栏：产物 ---- */
  aside { overflow-y:auto; padding:16px; min-height:0; }
  aside h2 { font-size:14px; color:var(--muted); margin:4px 0 12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:10px; }
  .card .id { font-weight:700; font-size:13px; }
  .card .meta { color:var(--muted); font-size:12px; margin-top:4px; line-height:1.5; }
  .card a { color:var(--accent); text-decoration:none; font-size:13px; }
  .badge { display:inline-block; background:var(--chip); border-radius:999px;
    padding:2px 8px; font-size:11px; margin-left:6px; }
  .empty { color:var(--muted); font-size:13px; }
</style>
</head>
<body>

<nav>
  <div class="top"><button id="newChat">＋ 新建会话</button></div>
  <div id="sessionList"></div>
  <div class="hint">会话列表仅存于本浏览器（localStorage）；移除不会删除服务端工作区。</div>
</nav>

<main>
  <header>
    <h1>finance-agent 投研工作台</h1>
    <div class="sub" id="sessionInfo">连接中…</div>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="例如：回顾英伟达近五年行情，梳理AI大事件，生成HTML" autocomplete="off" />
    <button id="send" type="submit">发送</button>
  </form>
</main>

<aside>
  <h2>产物（点击打开 / 版本历史）</h2>
  <div id="artifacts"><div class="empty">暂无产物</div></div>
</aside>

<script>
'use strict';
const $ = id => document.getElementById(id);
const log = $('log'), form = $('form'), input = $('input'), send = $('send');

/* ---------- 小工具：一律 textContent，动态内容不进 innerHTML ---------- */
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function scrollBottom() { log.scrollTop = log.scrollHeight; }

/* ---------- 会话列表（localStorage 持久化，FR-20） ---------- */
const store = {
  load() { try { return JSON.parse(localStorage.getItem('fa.sessions')) || []; } catch { return []; } },
  save(list) { localStorage.setItem('fa.sessions', JSON.stringify(list)); },
  get active() { return localStorage.getItem('fa.active') || null; },
  set active(id) { id ? localStorage.setItem('fa.active', id) : localStorage.removeItem('fa.active'); },
};
let sessions = store.load();
let activeId = store.active;
let serverInfo = { provider: '', model: '' };
let viewEpoch = 0;  // 每次切换视图 +1；流式回调据此判断"用户是否已离开发起时的视图"

/* ---------- 运行中轮次的内存缓冲 ----------
 * 事件先进缓冲再渲染：切走会话时 DOM 被清空，但缓冲不丢；切回来重放。
 * 轮次结束（done/error）后本轮已被服务端落库，缓冲即弃，回放走历史接口。 */
const liveTurns = {};      // sessionId -> turn
let pendingTurn = null;    // 新会话首条消息：session_id 未返回前暂存

function makeTurn(userText) {
  return { id: null, userText, events: [], done: false, ui: null };
}
function turnFor(id) {
  const turn = liveTurns[id];
  return turn && !turn.done ? turn : null;
}

function upsertSession(id, title) {
  const found = sessions.find(s => s.id === id);
  if (found) { if (title && !found.title) found.title = title; }
  else sessions.unshift({ id, title: title || id, ts: Date.now() });
  store.save(sessions);
}

function renderSessionList() {
  const box = $('sessionList');
  box.textContent = '';
  for (const s of sessions) {
    const item = el('div', 'sess' + (s.id === activeId ? ' active' : ''));
    item.appendChild(el('div', 't', s.title || s.id));
    const sub = el('div', 's', s.id);
    if (turnFor(s.id)) sub.appendChild(el('span', 'running', ' ● 运行中'));
    item.appendChild(sub);
    const del = el('button', 'del', '×');
    del.title = '从本地列表移除（不删除服务端数据）';
    del.addEventListener('click', ev => {
      ev.stopPropagation();
      sessions = sessions.filter(x => x.id !== s.id);
      store.save(sessions);
      if (activeId === s.id) newChat(); else renderSessionList();
    });
    item.appendChild(del);
    item.addEventListener('click', () => selectSession(s.id));
    box.appendChild(item);
  }
}

function updateSendState() {
  // 只在"当前视图对应的会话正在跑"时禁用；别的会话在跑不影响这里发新任务
  send.disabled = !!(activeId && turnFor(activeId));
}

/* ---------- 头部与产物面板（按会话） ---------- */
function renderHeader(workspaceDir) {
  const base = `${serverInfo.provider} · ${serverInfo.model}`;
  $('sessionInfo').textContent = activeId
    ? `会话 ${activeId} ｜ ${base}${workspaceDir ? ' ｜ ' + workspaceDir : ''}`
    : `新会话（发送首条消息后创建） ｜ ${base}`;
}

async function refreshArtifacts() {
  const box = $('artifacts');
  if (!activeId) { box.textContent = ''; box.appendChild(el('div', 'empty', '暂无产物')); return; }
  const forId = activeId;
  const resp = await fetch(`/api/sessions/${forId}/state`);
  if (!resp.ok || forId !== activeId) return;
  const state = await resp.json();
  renderHeader(state.workspace_dir);
  box.textContent = '';
  if (!state.artifacts.length) { box.appendChild(el('div', 'empty', '暂无产物')); return; }
  for (const a of state.artifacts) {
    const card = el('div', 'card');
    const idLine = el('div', 'id', a.artifact_id);
    idLine.appendChild(el('span', 'badge', 'v' + a.current_version));
    idLine.appendChild(el('span', 'badge', a.kind));
    card.appendChild(idLine);
    card.appendChild(el('div', 'meta', a.title));
    const history = el('div', 'meta');
    for (const h of a.history) history.appendChild(el('div', '', `v${h.v} ${h.change_summary}`));
    card.appendChild(history);
    const link = el('a', '', '打开当前版本');
    link.href = `/api/sessions/${forId}/artifacts/${a.artifact_id}/file`;
    link.target = '_blank'; link.rel = 'noopener';
    card.appendChild(link);
    box.appendChild(card);
  }
}

/* ---------- 消息渲染 ---------- */
function addMsg(cls, text) {
  const div = el('div', 'msg ' + cls, text);
  log.appendChild(div);
  scrollBottom();
  return div;
}

function newTrace() {
  const trace = el('details', 'trace');
  trace.open = true;
  const summary = el('summary');
  summary.appendChild(el('span', 'spin', '◌'));
  summary.appendChild(document.createTextNode(' 执行中…'));
  trace.appendChild(summary);
  trace._summary = summary;
  trace._steps = 0;
  log.appendChild(trace);
  scrollBottom();
  return trace;
}

function traceLine(trace, parts) {
  const line = el('div', 'line');
  for (const p of parts) line.appendChild(el('span', p.cls || '', p.text));
  trace.appendChild(line);
  trace._steps += 1;
  scrollBottom();
}

function finishTrace(trace, failed) {
  if (!trace) return;
  trace._summary.textContent = `${failed ? '✘ 执行中断' : '✔ 执行过程'}（${trace._steps} 步）`;
  trace.open = false;
}

/* ---------- 轮次事件 → UI（流式与重放共用同一份渲染逻辑） ---------- */
function applyEventToUi(turn, ev) {
  const ui = turn.ui;
  if (!ui) return;
  switch (ev.type) {
    case 'agent_start':
      if (!ui.trace) ui.trace = newTrace();
      traceLine(ui.trace, [{ text: '▸ ' }, { text: ev.agent, cls: 'agent' }, { text: ' 启动' }]);
      break;
    case 'tool_call':
      if (!ui.trace) ui.trace = newTrace();
      traceLine(ui.trace, [
        { text: '⚙ ' }, { text: `[${ev.agent}] `, cls: 'agent' },
        { text: ev.tool + (ev.detail ? '  ' + ev.detail : '') },
      ]);
      break;
    case 'tool_result':
      if (!ui.trace) ui.trace = newTrace();
      traceLine(ui.trace, [
        { text: ev.ok ? '✔ ' : '✘ ', cls: ev.ok ? 'okmark' : 'errmark' },
        { text: `[${ev.agent}] `, cls: 'agent' },
        { text: (ev.tool ? ev.tool + '  ' : '') + (ev.detail || '') },
      ]);
      break;
    case 'agent_end':
      if (!ui.trace) ui.trace = newTrace();
      traceLine(ui.trace, [{ text: '◂ ' }, { text: ev.agent, cls: 'agent' }, { text: ' 结束' }]);
      break;
    case 'delta':
      if (!ui.botDiv) ui.botDiv = addMsg('bot', '');
      ui.botDiv.textContent += ev.text;
      scrollBottom();
      break;
    case 'done':
      finishTrace(ui.trace, false); ui.trace = null;
      if (!ui.botDiv && ev.reply) ui.botDiv = addMsg('bot', ev.reply);
      break;
    case 'error':
      finishTrace(ui.trace, true); ui.trace = null;
      addMsg('error', '出错了：' + ev.text);
      break;
  }
}

function recordEvent(turn, ev) {
  turn.events.push(ev);
  if (ev.type === 'done' || ev.type === 'error') turn.done = true;
  applyEventToUi(turn, ev);
  if (turn.done) {
    if (turn.id) delete liveTurns[turn.id];  // 已落库，之后回放走历史接口
    renderSessionList();                     // 摘掉"运行中"状态点
    updateSendState();
    if (turn.id === activeId) refreshArtifacts();
  }
}

function attachTurn(turn) {
  // 切回运行中的会话：从缓冲整轮重放到当前 DOM
  turn.ui = { trace: null, botDiv: null };
  addMsg('user', turn.userText);
  for (const ev of turn.events) applyEventToUi(turn, ev);
}

function detachActiveTurn() {
  const turn = activeId ? liveTurns[activeId] : pendingTurn;
  if (turn) turn.ui = null;   // DOM 即将被清空，只断开引用，缓冲与流照常
}

/* ---------- 历史回放（FR-19：/api/sessions/{id}/messages） ---------- */
async function loadHistory(id) {
  log.textContent = '';
  const resp = await fetch(`/api/sessions/${id}/messages`);
  if (id !== activeId) return;  // 加载期间用户又切走了
  if (!resp.ok) { addMsg('error', '历史加载失败：' + resp.status); return; }
  const data = await resp.json();
  let trace = null;
  for (const m of data.messages) {
    if (m.role === 'action') {
      if (!trace) trace = newTrace();
      traceLine(trace, [
        { text: (m.ok === false ? '✘ ' : '⚙ '), cls: m.ok === false ? 'errmark' : '' },
        { text: m.tool + (m.detail ? '  ' + m.detail : '') },
      ]);
      continue;
    }
    if (trace) { finishTrace(trace, false); trace = null; }
    if (m.role === 'user') {
      addMsg('user', m.text);
      const sess = sessions.find(s => s.id === id);
      if (sess && (!sess.title || sess.title === id)) { sess.title = m.text.slice(0, 30); store.save(sessions); renderSessionList(); }
    }
    if (m.role === 'assistant') addMsg('bot', m.text);
  }
  if (trace) finishTrace(trace, false);
  scrollBottom();
}

/* ---------- 会话切换 / 新建 ---------- */
async function selectSession(id) {
  detachActiveTurn();
  viewEpoch += 1;
  activeId = id; store.active = id;
  renderSessionList(); renderHeader(); updateSendState();
  await Promise.all([loadHistory(id), refreshArtifacts()]);
  const turn = turnFor(id);
  if (turn && id === activeId) attachTurn(turn);  // 正在跑的这一轮接在历史后面
  input.focus();
}

function newChat() {
  detachActiveTurn();
  viewEpoch += 1;
  activeId = null; store.active = null;
  renderSessionList(); renderHeader(); updateSendState();
  log.textContent = '';
  const tip = el('div', 'empty-chat');
  tip.appendChild(el('div', '', '输入研究任务开始新会话'));
  tip.appendChild(el('div', '', '会话将在首条消息发出后创建并进入左栏'));
  log.appendChild(tip);
  refreshArtifacts();
  input.focus();
}
$('newChat').addEventListener('click', newChat);

/* ---------- 发送 + SSE 事件流（FR-18 协议见 docs/prd-web-ui-v2.md） ---------- */
form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  if (activeId && turnFor(activeId)) return;  // 当前会话正在跑（按钮本已禁用，兜底）
  input.value = '';
  const epoch = viewEpoch;
  const originId = activeId;                  // null = 新会话
  const turn = makeTurn(text);
  if (originId) { turn.id = originId; liveTurns[originId] = turn; }
  else pendingTurn = turn;

  if (epoch === viewEpoch) {
    if (!originId) log.textContent = '';      // 清掉"新会话"提示
    turn.ui = { trace: null, botDiv: null };
    addMsg('user', text);
  }
  renderSessionList(); updateSendState();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(originId ? { message: text, session_id: originId } : { message: text }),
    });
    if (!resp.ok) {
      recordEvent(turn, { type: 'error', text: `请求失败（HTTP ${resp.status}）` });
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();
      for (const frame of frames) {
        if (!frame.startsWith('data: ')) continue;
        const ev = JSON.parse(frame.slice(6));
        if (ev.type === 'session') {
          if (!turn.id) {
            turn.id = ev.session_id;
            liveTurns[turn.id] = turn;
            pendingTurn = null;
            upsertSession(turn.id, text.slice(0, 30));
            if (epoch === viewEpoch) {        // 用户还停在发起时的视图才接管它
              activeId = turn.id; store.active = activeId;
              renderHeader();
            }
            renderSessionList();
          }
          continue;
        }
        recordEvent(turn, ev);
      }
    }
    if (!turn.done) recordEvent(turn, { type: 'error', text: '连接中断（服务端可能仍在执行，稍后刷新历史查看）' });
  } catch (err) {
    if (!turn.done) recordEvent(turn, { type: 'error', text: '请求失败：' + err.message });
  } finally {
    updateSendState();
    if (turn.id === activeId || (!turn.id && epoch === viewEpoch)) input.focus();
  }
});

/* ---------- 启动 ---------- */
(async function init() {
  try {
    const state = await (await fetch('/api/state')).json();
    serverInfo = state;
    if (state.initial_session_id) {           // --web --resume <id> 并入左栏
      upsertSession(state.initial_session_id, '');
      if (!activeId) activeId = state.initial_session_id;
    }
  } catch { $('sessionInfo').textContent = '服务连接失败'; }
  if (activeId && !sessions.find(s => s.id === activeId)) activeId = null;
  store.active = activeId;
  renderSessionList();
  if (activeId) await selectSession(activeId); else newChat();
})();
</script>
</body>
</html>
